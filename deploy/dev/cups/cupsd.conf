# Development-only configuration: listens on all interfaces and allows any
# operation without authentication. Never use this on a real print server.
LogLevel warn
Listen 0.0.0.0:631
Listen /run/cups/cups.sock
ServerAlias *
WebInterface Yes
Browsing Off

<Location />
  Order allow,deny
  Allow all
</Location>

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
